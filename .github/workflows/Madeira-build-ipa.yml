name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Madeira
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show environment
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Swift ==="
          swift --version

          echo "=== Repository ==="
          git status
          git submodule status

      - name: Install build dependencies
        run: |
          brew update

          brew install \
            cmake \
            ninja \
            pkg-config \
            autoconf \
            automake \
            libtool \
            gettext \
            bison \
            flex \
            meson \
            nasm

      - name: Make build scripts executable
        run: |
          find build -type f -name "build.sh" -exec chmod +x {} \;
          find scripts -type f -name "*.sh" -exec chmod +x {} \; || true

      - name: Show build scripts
        run: |
          echo "=== build scripts ==="
          find build -type f -name "build.sh" -print | sort

      - name: Build native components
        shell: bash
        run: |
          set -euo pipefail

          for script in $(find build -type f -name "build.sh" | sort); do
            echo ""
            echo "=============================================="
            echo "BUILDING: $script"
            echo "=============================================="

            (
              cd "$(dirname "$script")"
              ./build.sh
            )
          done

      - name: Locate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode projects ==="

          find app \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Detect Xcode project and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find app -maxdepth 4 -name "*.xcodeproj" -print -quit)
          WORKSPACE=$(find app -maxdepth 4 -name "*.xcworkspace" -print -quit)

          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Using project: $PROJECT"
          else
            echo "ERROR: No Xcode project/workspace found."
            exit 1
          fi

      - name: List Xcode schemes
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then
            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -list
          else
            xcodebuild \
              -project "${{ steps.xcode.outputs.project }}" \
              -list
          fi

      - name: Build iOS application
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/DerivedData

          if [ -n "${{ steps.xcode.outputs.workspace }}" ]; then

            xcodebuild \
              -workspace "${{ steps.xcode.outputs.workspace }}" \
              -scheme Madeira \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build

          else

            xcodebuild \
              -project "${{ steps.xcode.outputs.project }}" \
              -scheme Madeira \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build

          fi

      - name: Find application
        shell: bash
        run: |
          set -e

          echo "=== Applications ==="

          find build/DerivedData \
            -type d \
            -name "*.app" \
            -print

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/DerivedData \
            -type d \
            -name "Madeira.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Madeira.app not found."

            echo ""
            echo "Available applications:"
            find build/DerivedData \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo "Application:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Madeira.app

          rm -f Madeira.ipa

          zip -r Madeira.ipa Payload

      - name: Verify IPA
        run: |
          echo "=== IPA ==="
          ls -lh Madeira.ipa

          echo ""
          echo "=== IPA contents ==="
          unzip -l Madeira.ipa | head -100

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 30
